name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Curriculum and core tests
        run: node --test tests/curriculum.test.mjs

      - name: Repository and documentation tests
        run: node --test tests/static.test.mjs

      - name: Syntax-check every module
        run: |
          find src -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
